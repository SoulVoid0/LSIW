# LSIW: let the kernel start Windows programs directly (./setup.exe, or a
# double-click in a file manager that executes files). binfmt_misc hands
# every file that starts with "MZ" to lsiw-binfmt, which is lsiw itself
# running `lsiw run <file> <arguments>`.
#
# Loaded by systemd-binfmt.service at boot; packages apply it at install
# time. binfmt_misc tries the most recently registered rule first and
# systemd-binfmt registers files in name order, so the "zz-" prefix puts
# this rule ahead of other MZ rules such as Wine's. `lsiw` decides per
# program whether its own engine or Wine runs it.
#
# SPDX-License-Identifier: AGPL-3.0-or-later
:LSIW:M::MZ::/usr/libexec/lsiw/lsiw-binfmt:
