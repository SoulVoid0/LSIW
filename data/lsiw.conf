# LSIW system-wide configuration (/etc/lsiw/lsiw.conf)
#
# Each user also has ~/.config/lsiw/lsiw.conf ($XDG_CONFIG_HOME/lsiw/lsiw.conf
# when that is set). It is read after this file, so its values win.
# `lsiw config` and LSIW Control (lsiw-control) write the user file.
# Setting $LSIW_CONFIG to a file makes LSIW read only that file.
#
# Format:
#   [section]
#   key = value
# Lines that start with '#' or ';' are comments. A comment cannot follow a
# value on the same line: everything after '=' is the value. A value may be
# wrapped in double quotes. Section and key names are case-insensitive.
#
# Every setting below is commented out and shows the built-in default.
# Remove the leading '#' to change one for all users of this computer.

[engine]

# Which engine runs Windows programs:
#   auto    LSIW's own engine when every DLL function the program imports
#           is implemented (`lsiw check program.exe` shows the result),
#           otherwise Wine
#   native  always LSIW's own engine; a program that calls a function LSIW
#           does not implement stops with a message naming it
#   wine    always Wine
#   proton  always Proton
#   custom  the engines of "chain" below, in order
# `lsiw run --engine=...` overrides this for one run.
#default = auto

# custom tries the engines of "chain" in order (the default engine and up
# to 3 fallbacks); a fallback runs a program the engine before it cannot
# run. Entries: native, auto, wine, wine:VERSION, proton, proton:VERSION.
#chain = native,wine,proton

# The Wine command used by the fallback engine: a name looked up in $PATH
# or a full path, for example /opt/wine-staging/bin/wine. Empty means
# "wine", then "wine64", from $PATH.
#wine =

[drive]

# The C: drive: one folder that every engine (LSIW's own, Wine, Proton)
# sees as C:\. It also shows every top-level Linux folder (C:\home, ...).
# Change it with `lsiw cdrive set PATH` or LSIW Control, which move its
# contents and leave a link at the old place.
#c_drive = ${HOME}/.cdrive

[prefix]

# The shared prefix every program and game uses unless it has its own
# (Wine prefix in its pfx folder; Proton and Steam games use it too).
#shared = ${DATA}/shared

[steam]

# Steam games started with an LSIW Proton tool run in the shared prefix.
# A game's own old prefix is kept as a backup.
#shared_prefix = true
# Games (app IDs, comma-separated) that keep a prefix of their own.
#own_prefix =

[wine]

# Wine Mono (.NET Framework for Wine) is installed into LSIW's Wine prefix
# when it is set up: the version the Wine build asks for, from
# ~/.cache/wine, /usr/share/wine/mono or a download (SHA-256 checked).
# off leaves .NET out.
#mono = auto

[runtime]

# Arguments that are existing absolute Linux paths (/home/me/notes.txt) are
# passed to Windows programs as C:\ paths (C:\home\me\notes.txt).
# false passes every argument unchanged.
#translate_args = true

[variables]

# Where each Windows folder lives on Linux. Keys are the variable names
# Microsoft's USMT documentation uses (CSIDL_PERSONAL, APPDATA, WINDIR, ...);
# `lsiw path` lists all of them with their current locations.
#
# Values are Linux paths. They may use the tokens the defaults are built
# from, which makes one line here right for every user:
#   ${HOME}  ${USER}  ${UID}  ${HOSTNAME}
#   ${DATA}         ~/.local/share/lsiw
#   ${XDG:NAME}     an XDG user folder: DOCUMENTS DESKTOP DOWNLOAD MUSIC
#                   PICTURES VIDEOS TEMPLATES PUBLICSHARE
#   ${VAR:NAME}     the Linux location of another variable
# `lsiw config` and LSIW Control also accept C:\... and %VAR%\... values and
# ~/..., and store the Linux path they stand for; in this file write Linux
# paths (or tokens) only.
#
# An alias sets the variable it stands for: APPDATA and CSIDL_APPDATA are
# the same folder. Folders that always sit inside another one (SYSTEM32,
# CSIDL_FONTS, HOMEPATH, COMSPEC, ...) follow it and cannot be moved alone.
# Plain values (USERNAME, COMPUTERNAME, USERSID) are used as written.
#
# Examples:

# Documents (default: your XDG Documents folder, usually ~/Documents)
#CSIDL_PERSONAL = ${HOME}/Documents/Windows

# Roaming application data, %APPDATA% (default: inside the Windows profile)
#APPDATA = ${HOME}/.local/share/lsiw/AppData/Roaming

# Local application data, %LOCALAPPDATA%
#CSIDL_LOCAL_APPDATA = ${HOME}/.cache/lsiw/AppData/Local

# Program Files on a bigger disk. Spaces in values need no quotes.
#CSIDL_PROGRAM_FILES = /run/media/${USER}/Games/Program Files

# The Windows folder, C:\windows (default: ${HOME}/Windows, which the Wine
# engine shares)
#WINDIR = ${DATA}/windows

# Temporary files, %TEMP% (TMP follows TEMP)
#TEMP = /tmp/lsiw-${USER}

# Your Windows profile, %USERPROFILE% (default: your home folder, ${HOME},
# seen as C:\users\<you>). AppData and the other profile folders move with it.
#USERPROFILE = ${DATA}/users/${USER}

# The computer name Windows programs see (default: the host name in capitals)
#COMPUTERNAME = WORKSTATION
